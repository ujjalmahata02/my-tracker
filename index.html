<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सटीक लोकेसन ट्र्याकर</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn { background-color: #007bff; color: white; padding: 14px 28px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #map-link { display: none; margin-top: 25px; font-size: 18px; color: #28a745; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>लोकेसन पत्ता लगाउनुहोस्</h2>
    <p>तलको बटनमा क्लिक गर्नुहोस् र लोकेसन अनुमति दिनुहोस्।</p>
    
    <button class="btn" onclick="startTracking()">लोकेसन देखाउनुहोस्</button>
    <div id="status" style="margin-top: 20px; font-size: 16px;"></div>
    <a id="map-link" href="#" target="_blank">🗺 यहाँ क्लिक गरेर गुगल म्यापमा हेर्नुहोस्</a>
</div>

<script>
function startTracking() {
    const status = document.getElementById("status");
    const mapLink = document.getElementById("map-link");
    status.innerHTML = "लोकेसन खोज्दै... कृपया १ सेकेन्ड पर्खिनुहोस्।";
    mapLink.style.display = "none";

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            status.innerHTML = `<strong>अक्षांश (Lat):</strong> ${lat}<br><strong>देशान्तर (Lon):</strong> ${lon}`;
            
            // गुगल म्यापको लिङ्क सेट गर्ने (त्रुटि सच्याइएको)
            mapLink.href = `https://google.com{lat},${lon}`;
            mapLink.style.display = "block"; 
        }, (error) => {
            status.innerHTML = "❌ त्रुटि: लोकेसन प्राप्त गर्न सकिएन। कृपया GPS अन भएको निश्चित गर्नुहोस्।";
        }, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        });
    } else {
        status.innerHTML = "यो ब्राउजरले लोकेसन सपोर्ट गर्दैन।";
    }
}
</script>

</body>
</html>
